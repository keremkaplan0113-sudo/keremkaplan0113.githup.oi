<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gezgin Dünya 🌍</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #07111f;
    color: white;
}

/* ÜST MENÜ */
header {
    background: linear-gradient(135deg, #071a2d, #0b4f6c);
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid #1da1f2;
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    color: #ccecff;
}

/* ARAMA */
.search-area {
    padding: 25px;
    text-align: center;
    background: #091827;
}

.search-box {
    width: min(700px, 90%);
    padding: 16px 20px;
    border-radius: 30px;
    border: 2px solid #1da1f2;
    background: #101f31;
    color: white;
    font-size: 18px;
    outline: none;
}

.search-box:focus {
    box-shadow: 0 0 15px rgba(29,161,242,.5);
}

/* BUTONLAR */
.categories {
    text-align: center;
    padding: 15px;
}

.filter-btn {
    border: none;
    padding: 11px 18px;
    margin: 5px;
    border-radius: 20px;
    cursor: pointer;
    background: #12395a;
    color: white;
    transition: .2s;
}

.filter-btn:hover,
.filter-btn.active {
    background: #1da1f2;
    transform: scale(1.05);
}

/* ŞEHİRLER */
.container {
    width: 92%;
    max-width: 1300px;
    margin: auto;
    padding: 20px 0 50px;
}

.section-title {
    margin-top: 25px;
    border-left: 5px solid #1da1f2;
    padding-left: 12px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.card {
    background: linear-gradient(145deg, #10253a, #0a1726);
    border: 1px solid #234761;
    border-radius: 18px;
    padding: 20px;
    cursor: pointer;
    transition: .25s;
    min-height: 190px;
}

.card:hover {
    transform: translateY(-7px);
    border-color: #1da1f2;
    box-shadow: 0 10px 25px rgba(0,0,0,.35);
}

.card .emoji {
    font-size: 40px;
}

.card h3 {
    margin: 10px 0 5px;
}

.card p {
    color: #b9cad7;
    line-height: 1.5;
}

.card .country {
    color: #55c7ff;
    font-size: 14px;
}

/* DETAY */
.detail {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0,0,0,.75);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.detail-box {
    background: #0c1d2e;
    border: 2px solid #1da1f2;
    border-radius: 22px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 30px;
    position: relative;
    box-shadow: 0 0 40px rgba(29,161,242,.25);
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 30px;
    cursor: pointer;
    color: #aaa;
}

.close:hover {
    color: white;
}

.detail-emoji {
    font-size: 70px;
}

.detail-box h2 {
    font-size: 35px;
    margin: 10px 0;
}

.info {
    background: #12283d;
    border-radius: 12px;
    padding: 15px;
    margin: 12px 0;
}

.info strong {
    color: #55c7ff;
}

.map-button {
    display: inline-block;
    background: #1da1f2;
    color: white;
    padding: 13px 20px;
    border-radius: 25px;
    text-decoration: none;
    margin-top: 10px;
    font-weight: bold;
}

.map-button:hover {
    background: #0d8ddd;
}

/* SONUÇ YOK */
.no-result {
    display: none;
    text-align: center;
    padding: 50px 20px;
    background: #102030;
    border-radius: 20px;
    margin-top: 20px;
}

.no-result span {
    font-size: 60px;
}

/* FOOTER */
footer {
    background: #050c14;
    text-align: center;
    padding: 30px;
    color: #9db2c2;
}

@media(max-width:600px) {
    header h1 {
        font-size: 28px;
    }

    .detail-box {
        padding: 22px;
    }
}
</style>
</head>

<header>

    <p>Türkiye'nin 81 ili ve dünyanın farklı ülkelerini keşfet!</p>
</header>

<section class="search-area">

            🌍 Hepsi

        <button class="filter-btn" onclick="filterCards('turkiye', this)">
            🇹🇷 Türkiye

        <button class="filter-btn" onclick="filterCards('dunya', this)">

    </div>

</section>

<main class="container">

    <h2 class="section-title">📍 Keşfet</h2>

    <div id="noResult" class="no-result">
        <span>🔎</span>
        <h2>Sonuç bulunamadı</h2>
        <p>Şehir veya ülke adını farklı yazmayı deneyebilirsin.</p>
    </div>

</main>

<div id="detail" class="detail">

</div>

<footer>

    Türkiye'nin 81 ili ve dünya şehirleri

/* TÜM VERİLER */

const allPlaces = [...turkiye, ...dunya];


/* HTML ÖZEL KARAKTERLERİNİ GÜVENLİ HALE GETİR */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* KARTLARI OLUŞTUR */

function showCards(list = allPlaces) {

    const cards = document.getElementById("cards");
    const noResult = document.getElementById("noResult");

    cards.innerHTML = "";

    if (!list || list.length === 0) {

        noResult.style.display = "block";

        return;
    }

    noResult.style.display = "none";

    list.forEach((place, index) => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="emoji">${escapeHTML(place.emoji)}</div>

            <div class="country">
                ${escapeHTML(
                    place.type === "turkiye"
                    ? "🇹🇷 Türkiye"
                    : "🌍 " + place.country
                )}
            </div>

            <h3>${escapeHTML(place.name)}</h3>

            <p>${escapeHTML(place.description)}</p>
        `;

        card.addEventListener("click", function() {
            openDetail(place);
        });

        cards.appendChild(card);

    });

}


/* DETAY AÇ */

function openDetail(place) {

    const detail = document.getElementById("detail");
    const content = document.getElementById("detailContent");

    const mapURL =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(place.lat + "," + place.lng);

    content.innerHTML = `

        <div class="detail-emoji">
            ${escapeHTML(place.emoji)}
        </div>

        <h2>${escapeHTML(place.name)}</h2>

        <div class="info">
            <strong>🌍 Bölge:</strong>
            ${escapeHTML(place.region)}
        </div>

        <div class="info">
            <strong>📖 Hakkında:</strong><br>
            ${escapeHTML(place.description)}
        </div>

        <div class="info">
            <strong>📍 Gezilecek Yerler:</strong><br>
            ${escapeHTML(place.places)}
        </div>

        <div class="info">
            <strong>🌿 Doğal Güzellik:</strong><br>
            ${escapeHTML(place.nature)}
        </div>

        <div class="info">
            <strong>🧭 Koordinatlar:</strong><br>
            ${place.lat}, ${place.lng}
        </div>

        <a
            class="map-button"
            href="${mapURL}"
            target="_blank"
            rel="noopener"
        >
            🗺️ Haritada Görüntüle
        </a>

    `;

    detail.style.display = "flex";

}


/* DETAY KAPAT */

function closeDetail() {

    document.getElementById("detail").style.display = "none";

}


/* DIŞARI TIKLAYINCA KAPAT */

document.getElementById("detail").addEventListener("click", function(e) {

    if (e.target === this) {
        closeDetail();
    }

});


/* ESC İLE KAPAT */

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {
        closeDetail();
    }

});


/* ARAMA */

document.getElementById("search").addEventListener("input", function() {

    const text = this.value
        .toLocaleLowerCase("tr-TR")
        .trim();

    if (text === "") {

        showCards(allPlaces);

        return;
    }

    const results = allPlaces.filter(place => {

        const values = [
            place.name,
            place.country,
            place.region,
            place.description,
            place.places,
            place.nature
        ];

        return values.some(value =>

            String(value)
                .toLocaleLowerCase("tr-TR")
                .includes(text)

        );

    });

    showCards(results);

});


/* FİLTRE */

function filterCards(type, button) {

    document.querySelectorAll(".filter-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    if (type === "all") {

        showCards(allPlaces);

    } else {

        showCards(
            allPlaces.filter(place => place.type === type)
        );

    }

}


/* SAYFA BAŞLANGIÇ */

showCards(allPlaces);

</script>
